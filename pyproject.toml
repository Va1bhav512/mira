[project]
name = "mira"
version = "0.1.0"
description = "Multimodal RAG for visually rich PDFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colpali-engine>=0.3.18",
    "python-dotenv>=1.0.0",
    "easyocr>=1.7.2",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.0",
    "transformers>=5.17.0",
    "torch>=2.4.0",
    "tqdm>=4.66.0",
    "bm25s>=0.3.12",
    "pystemmer>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mira"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
